---
- name: Install apache webserver
  hosts: web
  become: true
  gather_facts: true
  vars:
    document_root: /www
    html_root: "{{ document_root }}/html"
    pkgs:
      - httpd
    pkgs_manager: dnf
    service: httpd
    service_state: started
    service_enabled: true
    webuser: apache
    webgroup: apache
    conftemplate: "httpd.conf.j2"
    confroot: "/etc/httpd/conf"
    conffile: "httpd.conf"
    indextemplate: "index.html.j2"
    indexfile: "index.html"



  tasks:
    - name: Install httpd
      ansible.builtin.package:
        name: "{{ pkgs }}"
        state: present
        use: "{{ pkgs_manager }}"

    - name: Start httpd
      ansible.builtin.service:
        name: "{{ service }}"
        state: "{{ service_state }}"

    - name: Create /www/html
      ansible.builtin.file:
        path: /www/html
        state: directory
        mode: '0755'
        owner: "{{ webuser }}"
        group: "{{ webgroup }}"

    - name: copy index.html
      ansible.builtin.copy:
        src: ~/ansible-basis-training-lab/files/index.html
        dest: "{{ html_root }}"
        owner: "{{ webuser }}"
        group: "{{ webgroup }}"
        mode: "0755"

    - name: copy apache config
      ansible.builtin.template:
        src: ~/ansible-basis-training-lab/templates/httpd.conf.j2
        dest: "{{ confroot }}/{{ conffile }}"
        mode: "0644"
        owner: "{{ webuser }}"
        group: "{{ webgroup }}"
        backup: true
      notify:
        - restart httpd

  handlers:
   - name: restart httpd
     ansible.builtin.service:
       name: "{{ service }}"
       state: restarted