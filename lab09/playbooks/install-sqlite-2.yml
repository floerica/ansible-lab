---
# control block
  - name: check and print group 
    hosts: all
    become: yes
    gather_facts: true
# action block
    tasks:
    - name: "Print message"
      ansible.builtin.debug:
        msg: "Host {{ inventory_hostname }} is a member of the database group."
      when: inventory_hostname in groups['database']
    - name: Host is NOT in database group
      ansible.builtin.debug:
        msg: "Host {{ inventory_hostname }} is NOT a member of the database group."
      when: inventory_hostname not in groups['database']
    - name: print if not member of database second more stable possibility
      ansible.builtin.debug:
        msg: "this host {{ inventory_hostname }}" is not member of the database group"
      when "not 'database' in group_names"

    - name: print groups of node
      ansible.builtin.debug:
        var: group_names
...
