#document_root: /home/www

apache:
 RedHat:
   apache_confdir: /etc/httpd/conf
   apache_conftemplate: 
     - { src: httpd.conf.j2, dest: httpd.conf }
   apache_conffile: httpd.conf
   apache_service: httpd
   apache_user: apache
   apache_group: apache
   pkgs:
     - httpd
 Debian:
   apache_confdir: /etc/apache2
   apache_conffile: apache2.conf
   apache_conftemplate: 
     - { src: apache2.conf.j2, dest: apache2.conf }
     - { src: default-ssl.conf.j2, dest: sites-available/default-ssl.conf }
     - { src: 000-default.conf.j2, dest: sites-available/000-default.conf }
   apache_service: apache2
   apache_user: www-data
   apache_group: www-data
   pkgs:
     - apache2
     - python3-firewall
     - firewalld
 Suse:
   apache_confdir: /etc/apache2
   pkgs:
     - apache2
     - python3-selinux
     - policycoreutils-python
   apache_service: apache2
   apache_conffile: default-server.conf
   apache_conftemplate: 
     - { src: default-server.conf.j2, dest: default-server.conf }
   apache_user: wwwrun
   apache_group: www

apache_os: "{{ apache[ansible_os_family] }}"

