---
# tasks file for apache
- name: "install {{ apache_os.pkgs }}"
  ansible.builtin.package:
    name: "{{ apache_os.pkgs }}"
    state: present
    update_cache: true
- name: enable and start httpd
  ansible.builtin.service:
    name: "{{ apache_os.apache_service }}"
    state: "{{ apache_common_apache_service_state |default('started')}}"
    enabled: "{{ apache_common_apache_service_enabled |default(omit)}}"
- name: "create {{ apache_common_apache_htmlroot }}"
  ansible.builtin.file:
    path: "{{ apache_common_apache_htmlroot }}"
    mode: "{{ apache_common_apache_dirperm }}"
    owner: "{{ apache_os.apache_user }}"
    group: "{{ apache_os.apache_group }}"
    state: directory
- name: copy apache config
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ apache_os.apache_confdir }}/{{ item.dest }}"
    mode: "{{ apache_common_apache_fileperm }}"
    owner: "{{ apache_os.apache_user }}"
    group: "{{ apache_os.apache_group }}"
    backup: true
  notify:
    - restart-httpd
  loop: "{{ apache_os.apache_conftemplate }}"
- name: copy index.html
  ansible.builtin.template:
    src: "{{ apache_common_apache_indextemplate }}"
    dest: "{{ apache_common_apache_htmlroot }}/{{ apache_common_apache_indexfile }}"
    mode: "{{ apache_common_apache_fileperm }}"
    owner: "{{ apache_os.apache_user }}"
    group: "{{ apache_os.apache_group }}"
- name: "apply selinux to {{ apache_common_apache_documentroot }}"
  community.general.sefcontext:
    target: "{{ item }}"
    setype: httpd_sys_content_t
    state: present
  loop:
    - "{{ apache_common_apache_documentroot }}(/.*)?"
  when: ansible_selinux.status != 'disabled'
  register: apache_sefcontext
- name: relabel selinux
  ansible.builtin.command: "restorecon -irv {{ apache_common_apache_documentroot }}"
  when: apache_sefcontext.changed
- name: open firewall on port 80
  ansible.posix.firewalld:
    service: http
    state: enabled
    permanent: true
    immediate: true
    offline: true
- name: Flush handlers to make sure httpd is configured before the tests
  meta: flush_handlers
- name: test webserver from another host
  ansible.builtin.uri:
    url: "http://{{ item }}"
    return_content: true
  register: result
  loop: "{{ groups['web'] }}"
  delegate_to: localhost
- name: dump uri result
  ansible.builtin.debug:
    var: "result"
