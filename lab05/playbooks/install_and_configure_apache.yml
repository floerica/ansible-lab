---
# control block
- name: 'Install and Configure Apache'
  hosts: web
  become: true
  gather_facts: true

  # action block
  tasks:
    - name: 'Install apache webserver'
      ansible.builtin.package:
        name: 'httpd'
        state: 'present'

    - name: 'Enable and Start the apache service'
      ansible.builtin.service:
        name: 'httpd'
        enabled: true
        state: 'started'

    - name: 'Create /var/www/html and set permissions for apache'
      ansible.builtin.file:
        path: '/var/www/html'
        state: 'directory'
        owner: 'apache'
        group: 'apache'
        mode: '0755'

    - name: 'Copy index.html'
      ansible.builtin.copy:
        src: '/home/user/ansible-basis-training-lab/files/index.html'
        dest: '/var/www/html/index.html'
        owner: 'apache'
        group: 'apache'
        mode: '0644'

