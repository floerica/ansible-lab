---
- hosts: web
  become: true
  gather_facts: true
  tasks:
    - name: Load a variable file based on the OS type, or a default if not found.
      ansible.builtin.include_vars: "{{ lookup('ansible.builtin.first_found', params) }}"
      vars:
        params:
          files:
            - default.yml
          paths:
            - '../inventory/group_vars'

    - name: "install httpd"
      ansible.builtin.package:
        name: httpd
        state: present
        update_cache: true
    - name: enable and start httpd
      ansible.builtin.service:
        name: httpd
        state: started
        enabled: true
    - name: create /home/www/html
      ansible.builtin.file:
        path: /home/www/html
        mode: 0755
        owner: apache
        group: apache
        state: directory
    - name: copy apache config
      ansible.builtin.template:
        src: ../templates/httpd.conf.j2
        dest: /etc/httpd/conf/httpd.conf
        mode: 0644
        owner: apache
        group: apache
        backup: true
      notify:
        - restart-httpd
    - name: copy index.html
      ansible.builtin.template:
        src: ../files/index.html
        dest: /home/www/html/index.html
        mode: 0644
        owner: apache
        group: apache
    - name: Flush handlers to make sure httpd is configured before the tests
      meta: flush_handlers
  handlers:
    - name: restart-httpd
      ansible.builtin.service:
        name: httpd
        state: restarted
