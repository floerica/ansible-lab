---
- name: Write managednodes hosts into /etc/testfile
  hosts: all 
  gather_facts: true 
  become: true

  tasks:
    - name: Add each host from managednodes to /etc/testfile
      ansible.builtin.lineinfile:
        path: /etc/testfile
        line: "{{ item }}"
        create: true
        state: present
      loop: "{{ groups['managednodes'] }}"
    - name: Backup and remove 2 lines
      ansible.builtin.replace:
        path: /etc/testfile
        regexp: '^(.*\n){2}'
        replace: ''
        backup: true
      loop: "{{ groups['managednodes'] }}"
...
