---
# control block
  - name: Patche alles ausser den controlnode 
    hosts: all:!controlnode
    serial:
      - 1
      - 2
      - 100%
    become: yes
    gather_facts: true
# action block
    tasks:
    - name: Patching der Hosts
      ansible.builtin.package:
        name: "*"
        state: latest
