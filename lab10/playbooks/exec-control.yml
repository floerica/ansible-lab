---
- name: Patch all hosts in batches
  hosts: all:!controlnode
  become: true

  serial:
    - 1
    - 2
    - "100%"

  tasks:
    - name: Update installed packages
      ansible.builtin.package:
        name: "*"
        state: latest

    - name: Reboot if required
      ansible.builtin.reboot:
        reboot_timeout: 600
...
