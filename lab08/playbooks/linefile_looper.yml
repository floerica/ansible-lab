---
# control block
- name: 'Testing the templating'
  hosts: controlnode
  become: true
  gather_facts: true
  vars_files:
    - '../vars/default.yml'

  # action block
  tasks:
    - name: 'Load OS specific variables'
      ansible.builtin.include_vars: '../vars/{{ ansible_os_family }}.yml'

    - name: 'Loop managednodes'
      ansible.builtin.lineinfile:
        create: true
        group: 'user'
        owner: 'user'
        mode: '777'
        path: '/tmp/device_name_are/text'
        line: '{{ item }}'
        backup: true
      loop: "{{ groups['managednodes'] }}"
...
