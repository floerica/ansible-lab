---
- name: Maintain managed node list
  hosts: managednodes
  become: true

  tasks:
    - name: Write each managed node into test file
      ansible.builtin.lineinfile:
        path: /etc/testfile
        line: "{{ item }}"
        state: present
        create: true
        backup: true
        owner: root
        group: root
        mode: "0644"
      loop: "{{ groups['managednodes'] }}"
...
