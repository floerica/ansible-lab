---
# control block
- name: Install_apache_playbook
  hosts: web
  become: true
  gather_facts: true
# RWF vars block
#vars:
#  document_root: /www

# action block
  tasks:
    - name: Print ansible_facts
      ansible.builtin.debug:
        var: ansible_facts
    - name: Print group membership of hosts
      ansible.builtin.debug:
        var: group_names
    - name: Print hostvars per node
      ansible.builtin.debug:
        var: hostvars[inventory_hostname]
    - name: "Install_apache_task"
      ansible.builtin.package:
        name: "httpd"
        state: present
        update_cache: true
    - name: "Enable_and_start_httpd_task"
      ansible.builtin.service:
        name: "httpd"
        state: "started"
        enabled: true

    - name: create /www/html
      ansible.builtin.file:
        path: /www/html
        mode: 0755
        owner: apache
        group: apache
        state: directory

    - name: "Copy_an index.html_task"
        ansible.builtin.copy:
          src: ~/ansible-basis-training-lab/files/index.html
          dest: "/www/html"
 




---
- hosts: web
  become: true
  gather_facts: true
#  vars:
#    document_root: /www
  tasks:
    - name: "install httpd"
      ansible.builtin.package:
        name: "httpd"
        state: present
        update_cache: true
    - name: enable and start httpd
      ansible.builtin.service:
        name: "httpd"
        state: "started"
        enabled: "true"
    - name: create /www/html
      ansible.builtin.file:
        path: /www/html
        mode: 0755
        owner: apache
        group: apache
        state: directory
    - name: copy apache config
      ansible.builtin.template:
        src: httpd.conf.j2
        dest: /etc/httpd/conf/httpd.conf
        mode: 0644
        owner: apache
        group: apache
        backup: true
      notify:
        - restart-httpd
    - name: copy index.html
      ansible.builtin.template:
        src: index.html.j2
        dest: /www/html/index.html
        mode: 0644
        owner: apache
        group: apache
  handlers:
    - name: restart-httpd
      ansible.builtin.service:
        name: httpd
        state: restarted
...