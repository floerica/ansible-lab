---
# control block
  - name: lab08
    hosts: all
    become: yes
    gather_facts: true
# action block
    tasks:
    - name: edit testfile using loop
      ansible.builtin.lineinfile:
        path: /etc/testfile
        create: true
        backup: false
        line: "{{ item }}"
        state: present
      loop: "{{ query('inventory_hostnames', 'managednodes') }}"
...

