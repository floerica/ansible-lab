---
- hosts: web
  become: true
  gather_facts: true
  tasks:
    - name: Load a variable file based on the OS type, or a default if not found.
      ansible.builtin.include_vars: "{{ lookup('ansible.builtin.first_found', params) }}"
      vars:
        params:
          files:
            - default.yaml
          paths:
            - '../inventory/group_vars'

    - name: "install {{ apache_os.pkgs }}"
      ansible.builtin.package:
        name: "{{ apache_os.pkgs }}"
        state: present
        update_cache: true
    - name: enable and start httpd
      ansible.builtin.service:
        name: "{{ apache_os.apache_service }}"
        state: "{{ apache_os.apache_service_state |default(omit)}}"
        enabled: "{{ apache_os.apache_service_enabled |default(omit)}}"
    - name: create /home/www/html
      ansible.builtin.file:
        path: /home/www/html
        mode: 0755
        owner: apache
        group: apache
        state: directory
    - name: copy apache config
      ansible.builtin.template:
        src: ../templates/httpd.conf.j2
        dest: /etc/httpd/conf/httpd.conf
        mode: 0644
        owner: apache
        group: apache
        backup: true
      notify:
        - restart-httpd
    - name: copy index.html
      ansible.builtin.template:
        src: ../templates/index.html.j2
        dest: /home/www/html/index.html
        mode: 0644
        owner: apache
        group: apache
    - name: "apply selinux to {{ apache_os.apache_documentroot }}"
      community.general.sefcontext:
        target: "{{ item }}"
        setype: httpd_sys_content_t
        state: present
      loop:
        - /home
        - "{{ apache_os.apache_documentroot }}(/.*)?"
      register: apache_sefcontext
    - name: relabel selinux
      ansible.builtin.command: restorecon -irv /home
      when: apache_sefcontext.changed
    - name: open firewall on port 80
      ansible.posix.firewalld:
        service: http
        state: enabled
        permanent: true
        immediate: true
        offline: true
    - name: Flush handlers to make sure httpd is configured before the tests
      meta: flush_handlers
    - name: test webserver from another host
      ansible.builtin.uri:
        url: http://lx02
        return_content: true
      register: result
      delegate_to: localhost
    - name: dump uri result
      ansible.builtin.debug:
        var: result.content
  handlers:
    - name: restart-httpd
      ansible.builtin.service:
        name: httpd
        state: restarted
