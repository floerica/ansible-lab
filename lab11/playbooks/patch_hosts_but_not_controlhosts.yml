---
# control block
- name: 'update all but controlnode, serial 1,2'
  hosts: all
  become: true
  gather_facts: true
  vars_files:
    - '../vars/default.yml'
  serial:
    - 1
    - 2
    - '100%'

  # action block
  tasks:
    - name: 'Load OS specific variables'
      ansible.builtin.include_vars: '../vars/{{ ansible_os_family }}.yml'

    - name: 'Patch all but not controlnoe'
      ansible.builtin.package:
        name: '*'
        state: 'latest'
      when: "'controlnode' not in group_names" 

...
